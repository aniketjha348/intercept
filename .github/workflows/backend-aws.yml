# Backend → AWS (Terraform-canonical: ECR + ECS Fargate + ALB).
# Push image → force ECS rollout → wait stable → smoke-test the live API.
name: Backend to AWS

on:
  push:
    branches: ["main", "master"]
    paths:
      - "intercept-backend/**"
      - ".github/workflows/backend-aws.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPO: ${{ secrets.ECR_REPO }}

jobs:
  push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC role, no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::513594860857:role/InterceptGitHubDeploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPO:$GITHUB_SHA" -t "$REGISTRY/$ECR_REPO:latest" intercept-backend
          docker push "$REGISTRY/$ECR_REPO:$GITHUB_SHA"
          docker push "$REGISTRY/$ECR_REPO:latest"

  # ECS rolls :latest (task def pins the tag; force-deploy pulls it fresh).
  redeploy:
    needs: push
    runs-on: ubuntu-24.04
    steps:
      - name: Configure AWS credentials (OIDC role, no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::513594860857:role/InterceptGitHubDeploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Roll the service + wait until stable
        run: |
          aws ecs update-service --cluster intercept-backend \
            --service intercept-backend --force-new-deployment --output text
          aws ecs wait services-stable --cluster intercept-backend \
            --services intercept-backend
          echo "ECS stable"

  # This gate waits for the rollout and FAILS the workflow if the live API
  # isn't healthy — red pipeline, no doubt.
  # Skipped until API_URL is set (first-ever deploy has nothing to check yet).
  smoke:
    needs: [push, redeploy]
    runs-on: ubuntu-24.04
    env:
      API_URL: ${{ secrets.API_URL }}
    steps:
      # NOTE: `secrets.*` is not allowed in job-level `if` — gate lives here instead.
      - name: Precheck (skip cleanly before the first-ever deploy)
        id: pre
        run: |
          if [ -z "$API_URL" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "API_URL secret not set yet — nothing live to verify, skipping."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Wait for rollout + verify live API
        if: steps.pre.outputs.run == 'true'
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$API_URL/health" | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              echo "healthy after ~$((i * 20))s"
              break
            fi
            if [ "$i" = 30 ]; then echo "SMOKE FAILED: $API_URL/health never ok"; exit 1; fi
            sleep 20
          done
          curl -fsS --max-time 15 "$API_URL/app/latest" | grep -q version_code
          SID=$(curl -fsS --max-time 15 -X POST "$API_URL/calls/start" \
            -H "Content-Type: application/json" -d '{"caller":"ci-smoke"}' | grep -o '"session_id"[[:space:]]*:[[:space:]]*"[^"]*"')
          [ -n "$SID" ] || { echo "SMOKE FAILED: /calls/start"; exit 1; }
          echo "smoke OK: $SID"
