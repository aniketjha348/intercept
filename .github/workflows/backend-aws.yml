# Backend → AWS: pushes Docker image to ECR. App Runner auto-deploys it.
name: Backend to AWS

on:
  push:
    branches: ["main", "master"]
    paths:
      - "intercept-backend/**"
      - ".github/workflows/backend-aws.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPO: ${{ secrets.ECR_REPO }}

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC role, no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPO:$GITHUB_SHA" -t "$REGISTRY/$ECR_REPO:latest" intercept-backend
          docker push "$REGISTRY/$ECR_REPO:$GITHUB_SHA"
          docker push "$REGISTRY/$ECR_REPO:latest"
