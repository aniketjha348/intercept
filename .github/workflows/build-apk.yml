# No Android Studio needed: push karo, APK GitHub se download karo.
name: Build debug APK

on:
  push:
    branches: ["main", "master"]
    paths:
      - "intercept-android/**"
      - ".github/workflows/build-apk.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # needed for GitHub Releases on tags

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: intercept-android
    steps:
      - uses: actions/checkout@v5

      - name: Contract check (app routes match backend)
        # NOTE: this job defaults to working-directory intercept-android.
        run: python verify_contract.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: intercept-debug-apk
          path: intercept-android/app/build/outputs/apk/debug/app-debug.apk

      # Play-Store path (later): proves the release bundle builds on every push.
      # Publish to Play only after adding the upload keystore secrets + data-safety form.
      - name: Build release bundle (AAB)
        run: gradle bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v5
        with:
          name: intercept-release-aab
          path: intercept-android/app/build/outputs/bundle/release/app-release.aab

  # Tag like v0.2.0 → public GitHub Release with the APK.
  # Backend APK_URL + website download button point at this release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: intercept-debug-apk
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/app-debug.apk
          generate_release_notes: true

  # Tag → changelog entries in BOTH feeds, committed straight back to main.
  # That push redeploys the backend (/app/latest fresh) + website (card fresh).
  # Zero manual JSON edits, ever again. Idempotent: entry exists → no commit → no loop.
  metadata:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Generate feed entries
        id: meta
        run: |
          CHANGED=$(python scripts/release_metadata.py)
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Commit + push feed update
        if: steps.meta.outputs.changed == 'true'
        # GITHUB_TOKEN pushes do NOT trigger other workflows (GitHub blocks the
        # chain to prevent loops) — so deploys would never fire. RELEASE_TOKEN
        # (fine-grained PAT, Contents:write on this repo) restores the chain.
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git config user.name "intercept-bot"
          git config user.email "intercept-bot@users.noreply.github.com"
          git add intercept-backend/app/updates.json intercept-website/updates.json
          git commit -m "Release ${GITHUB_REF_NAME}: changelog feeds (auto)"
          if [ -n "$RELEASE_TOKEN" ]; then
            git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          else
            echo "RELEASE_TOKEN empty — pushing with GITHUB_TOKEN (deploys will NOT trigger; run them manually)"
          fi
          git push origin HEAD:main
