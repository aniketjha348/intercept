# Website → AWS: static site to S3 + CloudFront invalidation.
name: Website to AWS

on:
  push:
    branches: ["main", "master"]
    paths:
      - "intercept-website/**"
      - ".github/workflows/website-aws.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  S3_BUCKET: ${{ secrets.WEBSITE_BUCKET }}
  CF_DISTRIBUTION: ${{ secrets.CF_DISTRIBUTION_ID }}
  API_URL: ${{ secrets.API_URL }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC role, no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Point site at the API
        run: sed -i "s|https://YOUR-API-URL|${API_URL}|g" intercept-website/site.js intercept-website/index.html

      - name: Sync to S3
        # Pages + feeds must never cache (else users keep seeing the old
        # version/download link); fonts are fingerprinted-rare so they cache long.
        run: >
          aws s3 sync intercept-website/ "s3://${S3_BUCKET}/" --delete
          --exclude ".git*" --exclude "fonts/*"
          --cache-control "no-cache"

      # aws s3 sync takes Content-Type from Python's mimetypes, which does not
      # know .woff2 — it would land as binary/octet-stream and browsers may
      # refuse to use it for @font-face. Re-upload the fonts with the right
      # type. Runs after the sync so the last write wins.
      - name: Set font content types
        run: |
          aws s3 cp intercept-website/fonts/ "s3://${S3_BUCKET}/fonts/" --recursive \
            --content-type "font/woff2" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront (skips on S3-direct pilot)
        if: ${{ env.CF_DISTRIBUTION != '' }}
        run: aws cloudfront create-invalidation --distribution-id "${CF_DISTRIBUTION}" --paths "/*"
